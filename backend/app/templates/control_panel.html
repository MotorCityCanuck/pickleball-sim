<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simulation Control Panel</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        :root {
            color-scheme: light;
            --border: #d6d9df;
            --bg: #f4f6fa;
            --panel: #ffffff;
            --card-bg: #edf3f9;
            --card-bg-strong: #e7eef6;
            --text: #1d2433;
            --muted: #5a6477;
            --accent: #1857c2;
            --success: #247a3d;
            --warn: #9a6700;
            --error: #b42318;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background: var(--bg);
        }
        .page {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
        }
        .header p {
            margin: 6px 0 0;
            color: var(--muted);
        }
        .warnings {
            margin: 0 0 20px;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 8px;
        }
        .warning {
            border: 1px solid #f3d38a;
            background: #fff7e0;
            color: #704f00;
            border-radius: 8px;
            padding: 10px 12px;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .tab-button {
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            cursor: pointer;
        }
        .tab-button.active {
            border-color: var(--accent);
            color: var(--accent);
            background: #eef3ff;
        }
        .shell {
            border: 1px solid var(--border);
            background: var(--panel);
            border-radius: 8px;
            overflow: hidden;
        }
        .tab-content {
            padding: 20px;
        }
        .panel-section {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            background: var(--card-bg);
        }
        .info-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            background: var(--card-bg);
        }
        .state-card-ready {
            background: #edf8f0;
            border-color: #b7dfc2;
        }
        .state-card-blocked {
            background: #fef3f2;
            border-color: #f1b2ad;
        }
        .metric-card {
            border: 1px solid #eef1f5;
            border-radius: 8px;
            padding: 10px 12px;
            background: var(--card-bg-strong);
        }
        .empty-state-card {
            border-radius: 8px;
            padding: 12px;
            background: var(--card-bg);
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <div>
                <h1>Simulation Control Panel</h1>
                <p>Configuration, seed preparation, and synthetic generation control for pickleball workloads.</p>
            </div>
        </div>

        {% if snapshot.warnings %}
            <ul class="warnings">
                {% for warning in snapshot.warnings %}
                    <li class="warning">{{ warning }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <div class="tabs">
            <button
                id="control-tab-button-seed"
                class="tab-button active"
                type="button"
                data-tab-url="/control/partials/config/seed"
                onclick="window.loadControlPanelTab(this)"
            >
                Seed Data Config
            </button>
            <button
                id="control-tab-button-player-match"
                class="tab-button"
                type="button"
                data-tab-url="/control/partials/config/player-match"
                onclick="window.loadControlPanelTab(this)"
            >
                Player and Match Config
            </button>
            <button
                id="control-tab-button-export"
                class="tab-button"
                type="button"
                data-tab-url="/control/partials/config/export"
                onclick="window.loadControlPanelTab(this)"
            >
                Export Configuration
            </button>
            <button
                id="control-tab-button-orchestration"
                class="tab-button"
                type="button"
                data-tab-url="/control/partials/orchestration"
                onclick="window.loadControlPanelTab(this)"
            >
                Orchestration
            </button>
            <button
                id="control-tab-button-tournament-config"
                class="tab-button"
                type="button"
                data-tab-url="/control/partials/config/tournament"
                onclick="window.loadControlPanelTab(this)"
            >
                Tournament Config
            </button>
            <button
                id="control-tab-button-tournament"
                class="tab-button"
                type="button"
                data-tab-url="/control/partials/tournament"
                onclick="window.loadControlPanelTab(this)"
            >
                Tournament
            </button>
        </div>

        <div class="shell">
            <div
                id="control-tab-content"
                class="tab-content"
            >
                {% include "partials/control_config_tab.html" %}
            </div>
        </div>
    </div>
    <script>
        (() => {
            async function swapTabContent(target, html) {
                target.innerHTML = html;
                window.htmx?.process?.(target);
                const scripts = Array.from(target.querySelectorAll("script"));
                for (const originalScript of scripts) {
                    const replacement = document.createElement("script");
                    for (const attribute of originalScript.attributes) {
                        replacement.setAttribute(attribute.name, attribute.value);
                    }
                    replacement.textContent = originalScript.textContent;
                    originalScript.replaceWith(replacement);
                }
            }

            window.setControlPanelTab = function setControlPanelTab(activeButton) {
                document.querySelectorAll(".tab-button").forEach((button) => {
                    button.classList.toggle("active", button === activeButton);
                });
            };

            window.loadControlPanelTab = async function loadControlPanelTab(button) {
                const url = button?.dataset?.tabUrl;
                const target = document.getElementById("control-tab-content");
                if (!url || !target) {
                    return;
                }

                window.setControlPanelTab(button);
                target.setAttribute("aria-busy", "true");
                try {
                    const response = await window.fetch(url, {
                        headers: {
                            "X-Requested-With": "XMLHttpRequest",
                        },
                    });
                    if (!response.ok) {
                        throw new Error(`Tab request failed with status ${response.status}`);
                    }
                    const html = await response.text();
                    await swapTabContent(target, html);
                } catch (error) {
                    target.innerHTML = `
                        <div style="border:1px solid #f1b2ad; background:#fef3f2; color:#8f1d18; border-radius:8px; padding:10px 12px;">
                            Failed to load tab content.
                        </div>
                    `;
                    console.error(error);
                } finally {
                    target.removeAttribute("aria-busy");
                }
            };
        })();
    </script>
</body>
</html>
