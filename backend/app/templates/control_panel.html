<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simulation Control Panel</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        :root {
            color-scheme: light;
            --border: #d6d9df;
            --bg: #f4f6fa;
            --panel: #ffffff;
            --card-bg: #edf3f9;
            --card-bg-strong: #e7eef6;
            --text: #1d2433;
            --muted: #5a6477;
            --accent: #1857c2;
            --success: #247a3d;
            --warn: #9a6700;
            --error: #b42318;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background: var(--bg);
        }
        .page {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
        }
        .header p {
            margin: 6px 0 0;
            color: var(--muted);
        }
        .warnings {
            margin: 0 0 20px;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 8px;
        }
        .warning {
            border: 1px solid #f3d38a;
            background: #fff7e0;
            color: #704f00;
            border-radius: 8px;
            padding: 10px 12px;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .tab-button {
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            cursor: pointer;
        }
        .tab-button.active {
            border-color: var(--accent);
            color: var(--accent);
            background: #eef3ff;
        }
        .shell {
            border: 1px solid var(--border);
            background: var(--panel);
            border-radius: 8px;
            overflow: hidden;
        }
        .tab-content {
            padding: 20px;
        }
        .panel-section {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            background: var(--card-bg);
        }
        .info-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            background: var(--card-bg);
        }
        .state-card-ready {
            background: #edf8f0;
            border-color: #b7dfc2;
        }
        .state-card-blocked {
            background: #fef3f2;
            border-color: #f1b2ad;
        }
        .metric-card {
            border: 1px solid #eef1f5;
            border-radius: 8px;
            padding: 10px 12px;
            background: var(--card-bg-strong);
        }
        .empty-state-card {
            border-radius: 8px;
            padding: 12px;
            background: var(--card-bg);
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <div>
                <h1>Simulation Control Panel</h1>
                <p>Configuration, seed preparation, and synthetic generation control for pickleball workloads.</p>
            </div>
        </div>

        {% if snapshot.warnings %}
            <ul class="warnings">
                {% for warning in snapshot.warnings %}
                    <li class="warning">{{ warning }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <div class="tabs">
            <button
                id="control-tab-button-seed"
                class="tab-button active"
                type="button"
                data-tab-url="/control/partials/config/seed"
                onclick="window.loadControlPanelTab(this)"
            >
                Seed Data Config
            </button>
            <button
                id="control-tab-button-player-match"
                class="tab-button"
                type="button"
                data-tab-url="/control/partials/config/player-match"
                onclick="window.loadControlPanelTab(this)"
            >
                Player and Match Config
            </button>
            <button
                id="control-tab-button-orchestration"
                class="tab-button"
                type="button"
                data-tab-url="/control/partials/orchestration"
                onclick="window.loadControlPanelTab(this)"
            >
                Orchestration
            </button>
            <button
                id="control-tab-button-tournament-config"
                class="tab-button"
                type="button"
                data-tab-url="/control/partials/config/tournament"
                onclick="window.loadControlPanelTab(this)"
            >
                Tournament Config
            </button>
            <button
                id="control-tab-button-tournament"
                class="tab-button"
                type="button"
                data-tab-url="/control/partials/tournament"
                onclick="window.loadControlPanelTab(this)"
            >
                Tournament
            </button>
        </div>

        <div class="shell">
            <div
                id="control-tab-content"
                class="tab-content"
            >
                {% include "partials/control_config_tab.html" %}
            </div>
        </div>
    </div>
    <script>
        (() => {
            async function swapTabContent(target, html) {
                target.innerHTML = html;
                window.htmx?.process?.(target);
                const scripts = Array.from(target.querySelectorAll("script"));
                for (const originalScript of scripts) {
                    const replacement = document.createElement("script");
                    for (const attribute of originalScript.attributes) {
                        replacement.setAttribute(attribute.name, attribute.value);
                    }
                    replacement.textContent = originalScript.textContent;
                    originalScript.replaceWith(replacement);
                }
            }

            window.setControlPanelTab = function setControlPanelTab(activeButton) {
                document.querySelectorAll(".tab-button").forEach((button) => {
                    button.classList.toggle("active", button === activeButton);
                });
            };

            window.loadControlPanelTab = async function loadControlPanelTab(button) {
                const url = button?.dataset?.tabUrl;
                const target = document.getElementById("control-tab-content");
                if (!url || !target) {
                    return;
                }

                window.setControlPanelTab(button);
                target.setAttribute("aria-busy", "true");
                try {
                    const response = await window.fetch(url, {
                        headers: {
                            "X-Requested-With": "XMLHttpRequest",
                        },
                    });
                    if (!response.ok) {
                        throw new Error(`Tab request failed with status ${response.status}`);
                    }
                    const html = await response.text();
                    await swapTabContent(target, html);
                } catch (error) {
                    target.innerHTML = `
                        <div style="border:1px solid #f1b2ad; background:#fef3f2; color:#8f1d18; border-radius:8px; padding:10px 12px;">
                            Failed to load tab content.
                        </div>
                    `;
                    console.error(error);
                } finally {
                    target.removeAttribute("aria-busy");
                }
            };

            window.setControlPanelActionStatus = function setControlPanelActionStatus(message, kind) {
                const el = document.getElementById("export-release-action-status");
                if (!el) {
                    return;
                }
                el.style.display = "block";
                if (kind === "error") {
                    el.style.borderColor = "#f1b2ad";
                    el.style.background = "#fef3f2";
                    el.style.color = "#8f1d18";
                } else {
                    el.style.borderColor = "#b7dfc2";
                    el.style.background = "#edf8f0";
                    el.style.color = "#1f5f30";
                }
                el.textContent = message;
            };

            window.copyControlPanelText = async function copyControlPanelText(value) {
                try {
                    const response = await window.fetch("/control/system/copy-path", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
                        },
                        body: new URLSearchParams({ path: value }),
                    });
                    if (response.ok) {
                        window.setControlPanelActionStatus(`Copied release path: ${value}`, "success");
                        return;
                    }
                } catch (error) {
                    console.error(error);
                }
                try {
                    if (window.navigator?.clipboard?.writeText) {
                        await window.navigator.clipboard.writeText(value);
                        window.setControlPanelActionStatus(`Copied release path: ${value}`, "success");
                        return;
                    }
                } catch (error) {
                    console.error(error);
                }
                window.prompt("Copy path:", value);
            };

            window.openControlPanelFolder = async function openControlPanelFolder(value) {
                window.setControlPanelActionStatus(`Opening folder for ${value}...`, "success");
                try {
                    const response = await window.fetch("/control/system/open-folder", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
                        },
                        body: new URLSearchParams({ path: value }),
                    });
                    const payload = await response.json();
                    if (!response.ok || !payload.ok) {
                        throw new Error(payload.error || "Could not open the release folder.");
                    }
                    window.setControlPanelActionStatus(payload.message, "success");
                } catch (error) {
                    console.error(error);
                    window.setControlPanelActionStatus(error.message || "Could not open the release folder.", "error");
                }
            };

            window.downloadControlPanelReleasePackage = async function downloadControlPanelReleasePackage(value) {
                window.setControlPanelActionStatus(`Building release package for ${value}...`, "success");
                try {
                    const response = await window.fetch("/control/export/student-dataset/download-package", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
                        },
                        body: new URLSearchParams({ path: value }),
                    });
                    if (!response.ok) {
                        const message = await response.text();
                        throw new Error(message || "Could not build the release package.");
                    }
                    const blob = await response.blob();
                    const objectUrl = window.URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    const releaseName = value.split("/").filter(Boolean).pop() || "student_dataset_release";
                    link.href = objectUrl;
                    link.download = `${releaseName}.zip`;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    window.URL.revokeObjectURL(objectUrl);
                    window.setControlPanelActionStatus(`Downloaded release package for ${releaseName}.`, "success");
                } catch (error) {
                    console.error(error);
                    window.setControlPanelActionStatus(error.message || "Could not build the release package.", "error");
                }
            };

            window.runControlPanelReleaseQc = async function runControlPanelReleaseQc(value) {
                window.setControlPanelActionStatus(`Running DuckDB QC for ${value}...`, "success");
                try {
                    const response = await window.fetch("/control/export/student-dataset/run-qc", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
                        },
                        body: new URLSearchParams({ path: value }),
                    });
                    const payload = await response.json();
                    if (!response.ok || !payload.ok) {
                        const failures = (payload.failed_checks || [])
                            .map((row) => row.check_name)
                            .join(", ");
                        const detail = failures ? ` Failed checks: ${failures}.` : "";
                        throw new Error((payload.message || payload.error || "DuckDB QC failed.") + detail);
                    }
                    window.setControlPanelActionStatus(payload.message, "success");
                } catch (error) {
                    console.error(error);
                    window.setControlPanelActionStatus(error.message || "DuckDB QC failed.", "error");
                }
            };
        })();
    </script>
</body>
</html>
